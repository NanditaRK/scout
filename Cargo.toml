[package]
name = "scout"
version = "0.0.1"
authors = ["fishynand <fishynand@todo.todo>"]
edition = "2021"

#[[bin]]
#name = "scout"
#path = "src/main.rs"

[dependencies]
anyhow = {version = "1", features = ["backtrace"]}
rclrs = "*"
std_msgs = "*"
sensor_msgs = "*"
opencv = "*"
fishsense-core = { git = "https://github.com/UCSD-E4E/fishsense-core", branch = "main" }
ndarray = "0.17.2"
# This specific version is compatible with Rust 1.75
backtrace = "=0.3.74"

# uncomment the following section in order to fill in
# further dependencies manually.
# <dependency> = "*" 
